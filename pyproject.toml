[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathlang"
version = "0.9.2"
description = "A symbolic language with exact calculus, quotient algebras and checkable proofs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mathlang = "mathlang.__main__:main"
mathlang-ide = "mathlang.ide.app:main"

[tool.setuptools.packages.find]
include = ["mathlang*"]

[tool.setuptools.package-data]
mathlang = ["stdlib/*.math", "stdlib/**/*.math"]

[project.optional-dependencies]
ide = ["PySide6>=6.8", "matplotlib>=3.8"]
